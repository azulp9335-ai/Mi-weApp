<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Función recursiva</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body style="background:#1A0A22;margin:0;padding:20px;">
  <div class="exercise">
    <h1>Función recursiva</h1>

    <p>Se llama a sí misma hasta que se cumple una condición de salida.</p>
    <script>
        function cuentaRegresiva(numero) {
            if (numero <= 0) {
                document.write("¡Despegue!<br>");
                return;
            }
            document.write(numero + "<br>");
            cuentaRegresiva(numero - 1);
        }
        cuentaRegresiva(3);
    </script>

    <a href="index.html" class="back-link">← Volver al menú</a>
  </div>
</body>
</html>
