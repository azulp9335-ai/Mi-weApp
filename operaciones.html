<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Operaciones básicas</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body style="background:#1A0A22;margin:0;padding:20px;">
  <div class="exercise">
    <h1>Operaciones básicas</h1>

    <h2>OPERACIONES BASICAS</h2>
    <script>
        let n1=Number(prompt("escribe el primer numero"));
        let n2=Number(prompt("escribe el numero 2"));
        let resta=n1-n2;
        let suma=n1+n2;
        let mul=n1*n2;
        let divi=n1/n2;
        document.write("el resultado de la resta es "+ resta + "<br>");
        document.write("el resultado de la suma es "+ suma + "<br>");
        document.write("el resultado de la multiplicacion es "+ mul + "<br>");
        document.write("el resultado de la division es "+ divi + "<br>");
    </script>

    <a href="index.html" class="back-link">← Volver al menú</a>
  </div>
</body>
</html>
