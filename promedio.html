<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promedio</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body style="background:#1A0A22;margin:0;padding:20px;">
  <div class="exercise">
    <h1>Promedio</h1>

   <script>
       let nom = prompt('escribe tu nombre ');
       let mat = prompt('escribe tu materia ');
       let prom = Number(prompt('escribe tu promedio '));
      if(prom >= 6){
     alert("APROVADO")
     document.write("Tu nombre es"+ nom + "<br>");
     document.write("Tu Materia "+ mat + "<br>");
     document.write("Tu promedio es "+ prom + "<br>");
      }
      else{
        alert("REPROBRADO")
      }
 </script>

    <a href="index.html" class="back-link">← Volver al menú</a>
  </div>
</body>
</html>
