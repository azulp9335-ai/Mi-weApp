<!DOCTYPE html>

  <title>Imprimir Gato</title>

</head>
<body style="background:#1A0A22;margin:0;padding:20px;">
  <div class="exercise">
    <h1>Imprimir Gato</h1>

    <script>
 let cantidad = Number(prompt("¿Cuántas veces quieres imprimir la palabra gato?"));
for (let i = 1; i <= cantidad; i++) {
    document.write("Gato<br>");
}
    </script>

  </div>
