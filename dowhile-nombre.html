<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Nombre (do while)</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body style="background:#1A0A22;margin:0;padding:20px;">
  <div class="exercise">
    <h1>Nombre (do while)</h1>

<script>
let nombre;
do {
    nombre = prompt("Escribe tu nombre");
} while (nombre == "");
document.write("Hola " + nombre);
</script>

    <a href="index.html" class="back-link">← Volver al menú</a>
  </div>
</body>
</html>
