<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Función con return</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body style="background:#1A0A22;margin:0;padding:20px;">
  <div class="exercise">
    <h1>Función con return</h1>

    <p>Devuelve un resultado para usarlo en otras operaciones.</p>
    <script>
        function suma (a,b){
            return a + b;
        }
        let resultado = suma (5,10);
        document.write("<p>Resultado de suma(5, 10) = <b>" + resultado + "</b></p>");
    </script>

    <a href="index.html" class="back-link">← Volver al menú</a>
  </div>
</body>
</html>
