<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Función flecha (Arrow Function)</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body style="background:#1A0A22;margin:0;padding:20px;">
  <div class="exercise">
    <h1>Función flecha (Arrow Function)</h1>

    <p>Forma más corta de escribir una función. Se identifica por <b>=&gt;</b>.</p>
    <script>
        const multiplicar = (a, b) => {
            return a * b;
        };
        const sumar = (a, b) => a + b;
        document.write("multiplicar(4, 3) = <b>" + multiplicar(4, 3) + "</b><br>");
        document.write("sumar(2, 6) = <b>" + sumar(2, 6) + "</b>");
    </script>

    <a href="index.html" class="back-link">← Volver al menú</a>
  </div>
</body>
</html>
