<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>getElementsByClassName</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body style="background:#1A0A22;margin:0;padding:20px;">
  <div class="exercise">
    <h1>getElementsByClassName</h1>

<style>
div.example { border: 1px solid black; padding:8px; margin:8px 0; }
</style>
<p>Change the background color of the first element with the classes "example" and "color":</p>
<div class="example"><p>This is a paragraph.</p></div>
<div class="example color"><p>This is a paragraph.</p></div>
<div class="example color"><p>This is a paragraph.</p></div>
<script>
const collection = document.getElementsByClassName("example color");
collection[0].style.backgroundColor = "blue";
</script>

    <a href="index.html" class="back-link">← Volver al menú</a>
  </div>
</body>
</html>
