<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Función anónima</title>
  <link rel="stylesheet" href="estilo.css">
</head>
<body style="background:#1A0A22;margin:0;padding:20px;">
  <div class="exercise">
    <h1>Función anónima</h1>

    <p>No tiene nombre propio. Puede guardarse en una variable.</p>
    <script>
        const despedir = function() {
            alert("¡Hasta pronto!");
        };
        despedir();
        document.write("<p>Se ejecutó la función anónima <code>despedir</code>.</p>");
    </script>

    <a href="index.html" class="back-link">← Volver al menú</a>
  </div>
</body>
</html>
