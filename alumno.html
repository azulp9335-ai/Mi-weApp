<!DOCTYPE html>
<html lang="es">
<head>

<body style="background:#1A0A22;margin:0;padding:20px;">
  <div class="exercise">
    <h1>Datos del alumno</h1>

    <script>
       let nombre = prompt('escribe tu nombre ');
       let edad = Number(prompt('escribe tu edad '));
        let espe = prompt('escribe tu especialidad ');
         let direc = prompt('escribe tu direccions');
        document.write("Nombre: "+ nombre + "<br>");
        document.write("Edad: "+ edad + "<br>");
        document.write("Especialidad:  "+ espe + "<br>");
        document.write("Direccion: "+ direc + "<br>");
    </script>

  </div>
</body>
